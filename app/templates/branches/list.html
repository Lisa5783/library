{% extends "base.html" %}
{% block content %}
<h2>Список филиалов библиотеки</h2>
<a href="{{ url_for('branches.add') }}" class="btn btn-primary mb-2">Добавить филиал</a>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Название</th>
            <th>Адрес</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
    {% for branch in branches %}
        <tr>
            <td>{{ branch.name }}</td>
            <td>{{ branch.location }}</td>
            <td>
                <a href="{{ url_for('branches.edit', id=branch.id) }}" class="btn btn-sm btn-warning">Редактировать</a>
                <a href="{{ url_for('branches.delete', id=branch.id) }}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Вы точно хотите удалить филиал?');">Удалить</a>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
