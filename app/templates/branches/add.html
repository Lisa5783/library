{% extends "base.html" %}
{% block content %}
<h2>Добавление филиала библиотеки</h2>
<form method="post">
    {{ form.hidden_tag() }}
    <div class="mb-3">
        {{ form.name.label(class="form-label") }}
        {{ form.name(class="form-control") }}
    </div>
    <div class="mb-3">
        {{ form.location.label(class="form-label") }}
        {{ form.location(class="form-control") }}
    </div>
    <button type="submit" class="btn btn-success">Добавить</button>
    <a href="{{ url_for('branches.list') }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
